<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Publicações</title>
</head>
<body>
    <script>
        fetch("https://jsonplaceholder.typicode.com/posts")
        .then(resposta => resposta.json())
        .then(dados => {
            dados.forEach(publicações => {
                console.log("ID: ", publicações.id)
                console.log("Titulo: ", publicações.title)
                console.log("Conteudo: ", publicações.body)
            })
        .catch(erro => {
            console.log("Erro Encontrado!!", erro)
            })
        })
    </script>
</body>
</html>
